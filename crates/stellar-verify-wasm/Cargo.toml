[package]
name = "willow-stellar-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false






[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stellar-rpc-verify = { path = "../stellar-rpc-verify" }
wasm-bindgen = "=0.2.129"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
