# Unichain calls on op-revm 20 (revm 38), over state the log RPC proves; alloy stays the workspace's.
[package]
name = "willow-op-exec"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy-primitives = ">=1.1, <1.6"
alloy-rpc-types-eth = { version = ">=1.1, <1.6", default-features = false, features = ["std", "serde"] }
op-revm = { version = "20.0.0", default-features = false, features = ["std", "optional_block_gas_limit", "optional_eip3607", "optional_no_base_fee", "optional_fee_charge"] }
revm = { version = "38.0.0", default-features = false, features = ["std"] }
revm-inspectors = { version = "0.39.2", default-features = false, features = ["std"] }
# 2.0.5 and on want alloy-primitives 1.6, which would move the workspace's alloy.
alloy-rpc-types-eth-2 = { package = "alloy-rpc-types-eth", version = ">=2.0, <2.0.5", default-features = false, features = ["std", "serde"] }
alloy-rpc-types-trace-2 = { package = "alloy-rpc-types-trace", version = ">=2.0, <2.0.5" }
serde_json = "1"
