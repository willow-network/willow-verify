# Robinhood Chain (Arbitrum Nitro) calls over state the log RPC proves; the workspace's revm and alloy.
[package]
name = "willow-arb-exec"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy-primitives = { version = ">=1.1, <1.6", features = ["rlp"] }
alloy-rlp = "0.3"
# Nitro prices a call's L1 data by its size after brotli (Google's encoder, which this ports).
brotli = { version = "8", default-features = false, features = ["std"] }
revm = { version = "29.0.1", default-features = false, features = ["std", "optional_block_gas_limit", "optional_eip3607", "optional_no_base_fee"] }
