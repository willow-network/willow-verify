[package]
name = "anchor-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The ANCHOR child core: in-circuit sync-committee provenance for the stage-2
# beacon anchor. Verifies (1) a supermajority-participation BLS aggregate over an
# attested `BeaconBlockHeader`, (2) the finality branch proving a finalized header
# under the attested state, and (3, optional) the next-sync-committee branch — then
# commits the anchored `(beacon_state_root, slot)` plus the signing committee's SSZ
# root. Pure native Rust, the SAME code the SP1 program runs; every rejection is a
# real `Err`, no `assert_non_zero`.
#
# Feature `bls` (default ON) carries the bls12_381 dependency and the verify path.
# The aggregate consumes only the wire statement (`default-features = false`), so
# the curve crate never enters the audited aggregate build graph. Test BOTH
# configurations: building only one feature set
# can hide bugs in the other.
[dependencies]
sha2 = "0.11"
beacon-cl-core = { path = "../../beacon-cl-guest/core" }
bls12_381 = { version = "0.8.0", features = ["experimental"], optional = true }
# The sp1-patched bls12_381's hash-to-curve speaks the digest-0.10 API; this
# 0.10-line sha2 is used ONLY as `ExpandMsgXmd`'s hash (a handful of software
# compressions). Distinct major from the patched 0.11 above.
sha2-v010 = { package = "sha2", version = "0.10", optional = true }

[features]
default = ["bls"]
bls = ["dep:bls12_381", "dep:sha2-v010"]

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
