[package]
name = "window-anchor-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The BEACON-ANCHORED WINDOW guest core (statement kind 0x4101). Binds an old
# execution block's `(number, hash)` to a RECENT beacon block root `R` through the
# beacon state — `state.block_roots` for targets within 8,192 slots of the anchor,
# `state.historical_summaries` for anything older back to Capella. `R` is what
# EIP-4788 hands the contract, so only `R` has to be fresh: the window proof itself
# stops expiring after ~27 h (see ../SPEC.md).
#
# Pure native Rust, the SAME code the SP1 program runs. Every rejection is a real
# `Err` from `run()`; no panics on witness data, no `assert_non_zero`.
#
# `beacon-cl-core` is reused rather than re-implemented: `ForkVersion`,
# `state_tree_depth` (with its E0080 compile-time guard against the real
# `crates/network` `BeaconState` declarations), `verify_branch`, `branch_root`,
# `merkleize`, `hash_pair`, `uint64_leaf`, `mix_in_length` and — in tests —
# `StateLeaves`. This crate declares NO `BeaconState` field count of its own.
[dependencies]
beacon-cl-core = { path = "../../beacon-cl-guest/core" }

[features]
# The synthetic fixture builder (`synth`). OFF by default so the guest ELF — and
# therefore the vkey — never contains it. `cargo test` turns it on via
# `cfg(any(test, feature = "synth"))`; the `dump_blob` example asks for it.
default = []
synth = []

[dev-dependencies]
hex = "0.4"

[[example]]
name = "dump_blob"
required-features = ["synth"]
