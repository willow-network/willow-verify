[package]
name = "willow-logs-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"






[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logset-query = { path = "../query" }
willow-logs-verify = { path = "../query-verify", default-features = false }


wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]


test-cutover = []

[dev-dependencies]
logset-query = { path = "../query", features = ["fixtures"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
