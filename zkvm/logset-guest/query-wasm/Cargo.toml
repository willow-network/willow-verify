[package]
name = "willow-logs-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The browser verifier (web/verify): `logset_query::verify` with `Sp1Check`,
# compiled to wasm32 for a Web Worker. Its own workspace and lockfile, so the
# wasm-only crates never touch the guest's dependency graph.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logset-query = { path = "../query" }
willow-logs-verify = { path = "../query-verify", default-features = false }
wasm-bindgen = "=0.2.103"
js-sys = "=0.3.80"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# Some SP1 dependency pulls getrandom; on wasm32-unknown-unknown it needs the JS backend.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
logset-query = { path = "../query", features = ["fixtures"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
