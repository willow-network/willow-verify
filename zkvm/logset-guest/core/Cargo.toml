[package]
name = "logset-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
willow-receipts-trie = { path = "../../../crates/receipts-trie", default-features = false }

[features]
default = []
synth = []
# MEASUREMENT ONLY: one `cycle-tracker-report` span per opened block (`blk<i>`),
# so execrun can report the per-block cycle distribution. Never build the
# proving ELF with it (it adds a format! + two syscalls per block).
perblock = []
# The sorted log index (src/index.rs): a separate guest ELF; the default ELF is unchanged.
index = []

[dev-dependencies]
hex = "0.4"
flate2 = "1"
serde_json = "1"
alloy-trie = "0.9"
alloy-primitives = "1"
