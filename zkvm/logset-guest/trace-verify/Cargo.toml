# Trace proofs (willow_getTraceProof): the wire shape, the verifier the client runs and the
# server checks itself with, and the block runs both make. Ethereum's blocks run and are traced
# as the log RPC's `debug_trace*` / `trace_*` run them (revm 29, alloy-evm 0.21, revm-inspectors
# 0.30, geth's output where it differs); Unichain's as op-reth runs them (willow-op-exec).
# Host and wasm32; its OWN workspace, like state-verify. No dev-dependencies, so indexer-node,
# which depends on it by path, can run its tests (`cargo test -p trace-verify`).
[workspace]
resolver = "2"

[package]
name = "trace-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
logset-blockcheck = { path = "../blockcheck" }
logset-blockproof = { path = "../blockproof" }
willow-op-exec = { path = "../../../crates/op-exec" }
# A call's trace runs the call as a call proof does: its witness, overrides and reth's gas rules.
state-verify = { path = "../state-verify" }
alloy = { version = ">=1.1, <1.6", default-features = false, features = ["std", "consensus", "eips", "rlp", "k256", "rpc-types-eth", "rpc-types-trace", "trie"] }
alloy-primitives = "1"
alloy-rlp = "0.3"
alloy-trie = "0.9"
alloy-evm = { version = "0.21.3", default-features = false, features = ["std"] }
alloy-hardforks = "0.3.5"
revm = { version = "29.0.1", default-features = false, features = ["std", "optional_block_gas_limit", "optional_eip3607", "optional_no_base_fee"] }
revm-inspectors = { version = "0.30.1", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# k256 (the EVM's ecrecover) pulls getrandom 0.2 (through rand_core); on wasm32-unknown-unknown it needs the JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
