[package]
name = "willow-state-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false





[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
state-verify = { path = "../state-verify" }

trace-verify = { path = "../trace-verify" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
