[package]
name = "parlia-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false






[workspace]

[dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std", "k256", "rlp"] }
alloy-rlp = "0.3"

bls12_381 = { version = "0.8.0", features = ["experimental"] }

sha2 = "0.9"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
flate2 = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
