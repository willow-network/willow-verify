[package]
name = "willow-anchor-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false



[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anchor-verify = { path = "../anchor-verify" }
wasm-bindgen = "=0.2.129"

getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
