[package]
name = "willow-anchor-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The browser verifier's block confirmation (web/verify, TRUSTLESS-ANCHOR.md): `anchor-verify`
# compiled to wasm32 for the page's Web Worker. Its own workspace and lockfile, like items-wasm.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anchor-verify = { path = "../anchor-verify" }
wasm-bindgen = "=0.2.129"
# k256 (the EVM's ecrecover) pulls getrandom 0.2 (through rand_core); on wasm32-unknown-unknown it needs the JS backend.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
