[package]
name = "willow-items-verify-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false






[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logset-blockproof = { path = "../blockproof" }
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }

serde_json = { version = "1", features = ["float_roundtrip"] }
hex = "0.4"
anyhow = "1"

getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
