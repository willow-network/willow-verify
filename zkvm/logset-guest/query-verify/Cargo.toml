[package]
name = "willow-logs-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Checks a Willow RPC response on the client: every SP1 and OpenVM proof of a
# log response against the pinned program keys of its own system, every range
# proof, the links between parts, and (optionally) another provider's
# eth_getLogs response against the proven logs. Transaction, receipt, block and
# fee proofs (Merkle-Patricia, no zk) with the verify page's own items module
# (items-wasm, on logset-blockproof); state, call and estimate proofs with its
# state module (state-wasm, on state-verify). Every proven block is anchored on
# its chain's L1 (or, on BNB Smart Chain, its own validators) by anchor-verify's
# light clients, as the page anchors it.
#
# SP1 and OpenVM cannot share one dependency graph (see
# ../../logset-guest-openvm/verify/Cargo.toml), so this crate verifies SP1 proofs
# itself and has OpenVM proofs verified by `willow-logs-verify-openvm`: the CLI
# runs that binary, the browser loads it as a second wasm module. Only the
# minted OpenVM keys are linked here (that crate without its `verifier`).
[dependencies]
logset-query = { path = "../query" }
willow-logs-verify-openvm = { path = "../../logset-guest-openvm/verify", default-features = false }
logset-blockproof = { path = "../blockproof", optional = true }
anchor-verify = { path = "../anchor-verify", optional = true }
willow-items-verify-wasm = { path = "../items-wasm", optional = true }
willow-state-verify-wasm = { path = "../state-wasm", optional = true }
sp1-verifier = "=6.8.1"
sp1-primitives = "=6.8.1"
slop-algebra = "=6.8.1"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_json = "1"
hex = "0.4"

# Stand-in proofs, for the test of the pinned cutover; sha256 for pre-merge test anchors.
[dev-dependencies]
logset-query = { path = "../query", features = ["fixtures"] }
sha2 = "0.10"

# The library (`Sp1Check`, pinned keys) builds without the HTTP client, the
# item and state verifiers or the anchor, so the browser verifier (`query-wasm`)
# reuses it on wasm32.
[features]
default = ["cli"]
cli = [
  "dep:reqwest",
  "dep:logset-blockproof",
  "dep:anchor-verify",
  "dep:willow-items-verify-wasm",
  "dep:willow-state-verify-wasm",
]

[[bin]]
name = "willow-logs-verify"
path = "src/main.rs"
required-features = ["cli"]

# Its own workspace and lockfile, like blockproof and the wasm modules: the anchor's and the
# EVM's dependencies stay out of the guests' workspace (../Cargo.toml) and its lockfile.
[workspace]
resolver = "2"
