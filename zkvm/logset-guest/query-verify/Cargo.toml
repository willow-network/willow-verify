[package]
name = "willow-logs-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Checks a Willow log RPC answer on the client: every SP1 proof against the
# pinned program keys, every range proof, the links between parts, and
# (optionally) another provider's eth_getLogs answer against the proven logs.
# Transaction and receipt proofs (Merkle-Patricia, no zk) with
# logset-blockproof.
[dependencies]
logset-query = { path = "../query" }
logset-blockproof = { path = "../blockproof", optional = true }
sp1-verifier = "=6.8.1"
sp1-primitives = "=6.8.1"
slop-algebra = "=6.8.1"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_json = "1"
hex = "0.4"

# The library (`Sp1Check`, pinned keys) builds without the HTTP client or the
# block proofs, so the browser verifier (`query-wasm`) reuses it on wasm32.
[features]
default = ["cli"]
cli = ["dep:reqwest", "dep:logset-blockproof"]

[[bin]]
name = "willow-logs-verify"
path = "src/main.rs"
required-features = ["cli"]
