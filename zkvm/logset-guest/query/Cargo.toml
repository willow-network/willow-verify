[package]
name = "logset-query"
version = "0.1.0"
edition = "2021"
license = "MIT"




[dependencies]
logset-core = { path = "../core", features = ["index"] }
logset-agg-core = { path = "../agg-core", features = ["index"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = { version = "0.10", optional = true }

[features]

fixtures = ["logset-core/synth", "dep:sha2"]

[dev-dependencies]
logset-core = { path = "../core", features = ["index", "synth"] }
sha2 = "0.10"
