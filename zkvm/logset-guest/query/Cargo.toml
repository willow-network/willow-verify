[package]
name = "logset-query"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Complete log queries over proven segments (DESIGN §2.7): the server builds
# range proofs from the segment tier's store, the client checks them. Host-only;
# no SP1 dependency (the proof check is a trait the caller implements).
[dependencies]
logset-core = { path = "../core", features = ["index"] }
logset-agg-core = { path = "../agg-core", features = ["index"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = { version = "0.10", optional = true }

[features]
# Synthetic chains and stand-in proofs for tests here and in the indexer node.
fixtures = ["logset-core/synth", "dep:sha2"]

[dev-dependencies]
logset-core = { path = "../core", features = ["index", "synth"] }
sha2 = "0.10"
